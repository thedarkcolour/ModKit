plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.163'
    id 'maven-publish'
}

version = '1.0'
group = 'thedarkcolour.modkit'
base.archivesName = 'modkit'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
    }

    client {
        workingDirectory project.file('run')

        modSource project.sourceSets.main
    }

    server {
        workingDirectory project.file('run')

        modSource project.sourceSets.main
    }

    data {
        workingDirectory project.file('run')

        modSource project.sourceSets.main

        programArguments.addAll '--mod', 'modkit', '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
    }

    testmodClient {
        workingDirectory project.file('run')

        modSource project.sourceSets.main
        modSource project.sourceSets.test
    }

    testmodData {
        workingDirectory project.file('run')

        modSource project.sourceSets.main
        modSource project.sourceSets.test

        programArguments.addAll '--mod', 'testmod', '--all', '--output', file('src/generated_test/resources/').absolutePath, '--existing', file('src/test/resources').absolutePath
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.test.resources { srcDir 'src/generated_test/resources' }

dependencies {
    implementation 'net.neoforged:neoforge:21.1.0'
}

processResources {
    doLast {
        fileTree(dir: outputs.files.asPath, include: "**/*.json").each {
            File file -> file.text = groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parse(file))
        }
    }
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : "modkit",
                "Specification-Vendor"    : "thedarkcolour",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "examplemodsareus",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

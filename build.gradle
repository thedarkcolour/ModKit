plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'checkstyle'
    id 'net.neoforged.gradle.userdev' version '7.0.142'
}

version = '1.0'
group = 'thedarkcolour.modkit'
base {
    archivesName = 'modkit'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    create("client")

    server {
        programArgument '--nogui'
    }

    data {
        modSource project.sourceSets.test
        programArguments.addAll '--mod', 'modkit', '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.test.resources { srcDir 'src/generated_test/resources' }

repositories {
    maven {
        name 'Maven for PR #1076' // https://github.com/neoforged/NeoForge/pull/1076
        url 'https://prmaven.neoforged.net/NeoForge/pr1076'
        content {
            includeModule('net.neoforged', 'testframework')
            includeModule('net.neoforged', 'neoforge')
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

processResources {
    doLast {
        fileTree(dir: outputs.files.asPath, include: "**/*.json").each {
            File file -> //noinspection UnnecessaryQualifiedReference
                file.text = groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parse(file))
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
